# sa2-nx on the ultimate base: the code generator's configuration for default.xex (Sonic Adventure 2, title 58411202,
# XDK 2.0.21076). The stage DLL's is config/codegen_keys_data_dll.toml plus overrides_data_dll.toml.
#
# The keys are sa2-nx 1.0.6's (its app/perf_overrides.toml, the "optimised" flavour 1.0.6 shipped; its
# docs/cpu-rounds.md has the measurements behind each), which are also the base's generic set. Where SA2's differ
# from the base's (Katamari's) the reason is given. Root keys: they must stay outside any table, so the includes'
# tables come after them.

includes = [
"config/renut_funcs.toml",
"config/renut_hooks.toml",
"overrides.toml",
]

# Registers and flags as C++ locals, no MSR fences, the D-form split, the conversions inline (sa2-nx round 7 and the
# CPU rounds of 2026-10-12; UnleashedRecomp-NX, MarathonRecomp-NX, masseffect-nx and sasrt-nx ship the same).
cr_as_local = true
ctr_as_local = true
xer_as_local = true
reserved_as_local = true
skip_msr = true
dform_disp_split = true
fctiwz_inline = true
fcti_inline = true
div_inline = true
dcbt_prefetch = true
rotate_word_shifts = true
fp_compares_modeless = true
fp_moves_modeless = true
fp_mode_lookahead = true
# sa2-nx's own decision (2026-10-12, docs/cpu-rounds.md "no any-mode conversions on a bet"): with the bet past a
# branch SA2 ran 94,000 any-mode tests a frame to save nine flush-mode switches a frame in play. The base (Katamari)
# has it on. Both forms are exact; this only chooses between them.
fp_mode_lookahead_past_branch = false
fp_copy_pairs = true
fp_copy_forwarding = true
# The register diet (sa2-nx round 7, 2026-10-07): r14-r31, f14-f31, v14-v31 / v64-v127 as C++ locals, no
# `ctx.lr = <return address>` before every call, r0 / r2 / r11 / r12 / f0 / v32-v63 as locals. SA2 has no codec that
# keeps constants in VMX128 registers across calls, so it needs no non_volatile_as_local_keep (Katamari keeps
# v64-v127 for its movie codec); 1.0.6 shipped without one.
non_volatile_as_local = true
elide_lr_stores = true
non_argument_as_local = true
# The functions that read a non-argument register at entry or after a call (sa2-nx's audit; the last is the DLL's):
non_argument_as_local_keep = [0x827F5144, 0x82801D90, 0x827EFE34, 0x88010BE4]
